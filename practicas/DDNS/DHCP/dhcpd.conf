##############################################################################
# # # #                CONFIGURACION DHCP                                  # #
##############################################################################

########### CONFIGURACION RED-1
############# PLANTILLA DE EJEMPLO! ######################
## ¿Prioridad sobre los otros servidores DHCP?
authoritative;
## ¿Donde registra las inicidencias el servidor DHCP? (DEJAR POR DEFECTO) 
# Si tiene puesto local7, va a journalctl y syslog
log-facility local7;

########3 CONFIGURACIÓN DDNS
ddns-updates on;
update-static-leases on;
ddns-update-style interim;
ignore client-updates;
deny client-updates;


###### ESTO CAMBIARLO POR LA CARPETA Y EL FICHERO
include "/etc/bind/ddns/rndc.key";
##########

####### empresa.org

subnet 11.110.120.0 netmask 255.255.255.0 {
    ddns-domainname "empresa.org.";
    ddns-rev-domainname "in-addr.arpa.";
    zone empresa.org.
    {
	primary 127.0.0.1;
	key "rndc-key";
    }

    zone 120.110.11.in-addr.arpa.
    {
	primary 127.0.0.1;
	key "rndc-key";
    }



	### IP del servidor
    server-identifier 11.110.120.250;
	## Tiempo por defecto
    default-lease-time 10800;
	## Tiempo máximo
    max-lease-time 10800;
	## RANGO (PREGUNTAR SI LAS EXCLUSIONES SE INCLUYEN LOS EXTREMOS)
    range 11.110.120.1 11.110.120.15;
	## GATEWAY
    option routers 11.110.120.251;
	## NOMBRE DE LA RED (dominio)
    option domain-name "empresa.org";
	## SERVIDORES DNS - SEPARADO POR COMAS
    option domain-name-servers 11.110.120.250;
	##
#    option domain-search "example.com", "sales.example.com", "marketing.example.com";
	## FINAL DE LA RED
    option broadcast-address 11.110.120.255;
}

